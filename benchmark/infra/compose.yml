name: trading-desk-benchmark

x-bench: &bench
  build:
    context: ../..
    dockerfile: benchmark/infra/Dockerfile
  image: trading-desk-benchmark
  volumes:
    - ..:/bench
  environment:
    DATABASE_URL: &database postgresql+psycopg://bench:bench@postgres:5432/bench
    DATABASE_MIGRATION_URL: *database
    DATABASE_POOL_SIZE: 15
    DATABASE_MAX_OVERFLOW: 0
    LOG_LEVEL: WARNING

x-server: &server
  <<: *bench
  cpuset: "7"
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.6
    cpuset: "4-5"
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bench"]
      interval: 1s
      retries: 30

  migrate:
    <<: *bench
    command: alembic -c /app/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  stub:
    <<: *bench
    cpuset: "6"
    command: uvicorn downstream_stub.app:app --host 0.0.0.0 --port 9000 --no-access-log

  bottle-sync:
    <<: *server
    command: gunicorn -w 1 -b 0.0.0.0:8000 sample_wsgi.app:app

  bottle-threads:
    <<: *server
    command: gunicorn -w 1 -k gthread --threads 40 -b 0.0.0.0:8000 sample_wsgi.app:app

  bottle-wsgiref:
    <<: *server
    command: ["python", "-c", "from desk_runtime.service_runtime import ThreadedServer; from sample_wsgi.app import app; app.run(host='0.0.0.0', port=8000, server=ThreadedServer)"]

  bottle-threads-256:
    <<: *server
    command: gunicorn -w 1 -k gthread --threads 256 -b 0.0.0.0:8000 sample_wsgi.app:app

  fastapi-async:
    <<: *server
    command: uvicorn sample_asgi.app:app --host 0.0.0.0 --port 8000 --no-access-log

  fastapi-sync:
    <<: *server
    command: uvicorn sample_asgi.app:sync_app --host 0.0.0.0 --port 8000 --no-access-log

  loadgen:
    <<: *bench
    cpuset: "0-3"
    pid: host
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: 1
    command: sleep infinity
