name: trading-desk-desk

x-desk: &desk
  build:
    context: ../..
    dockerfile: benchmark/infra/desk.Dockerfile
  image: trading-desk-desk
  init: true
  volumes:
    - ..:/bench

x-service-env: &service-env
  DATABASE_URL: postgresql+psycopg://desk:desk@postgres:5432/desk
  DATABASE_POOL_SIZE: 15
  DATABASE_MAX_OVERFLOW: 0
  LOG_LEVEL: WARNING
  LOG_DIR: /tmp/desk-logs
  VARIANT: ${VARIANT:-gunicorn}
  FINNHUB_API_KEY: bench
  FINNHUB_PROVIDER_LIMIT_PER_MINUTE: 1000000
  PROVIDER_BUDGET_USAGE_PERCENT: 100
  FINNHUB_POLL_CONCURRENCY: 64
  FINNHUB_BASE_URL: http://stub:9000/finnhub
  ALPHA_VANTAGE_BASE_URL: http://stub:9000/alphavantage
  NBP_BASE_URL: http://stub:9000/nbp
  ECB_BASE_URL: http://stub:9000/ecb
  FRED_BASE_URL: http://stub:9000/fred
  EIOPA_BASE_URL: http://stub:9000/eiopa

x-service: &service
  <<: *desk
  environment: *service-env
  stop_grace_period: 10s
  depends_on:
    postgres:
      condition: service_healthy

x-stream-service: &stream-service
  <<: *service
  environment:
    <<: *service-env
    SERVER_THREADS: ${STREAM_THREADS:-256}

services:
  postgres:
    image: postgres:18.6
    cpuset: "2,3"
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    volumes:
      - desk_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "desk"]
      interval: 1s
      retries: 30

  stub:
    <<: *desk
    cpuset: "5"
    command: uvicorn desk_day.stub:app --host 0.0.0.0 --port 9000 --no-access-log --log-level warning

  market-data-service:
    <<: *stream-service
    cpuset: "7"
    command: ["python", "-m", "desk_day.launch", "market-data-service"]

  pricing-service:
    <<: *stream-service
    cpuset: "6"
    command: ["python", "-m", "desk_day.launch", "pricing-service"]

  trade-action-service:
    <<: *service
    cpuset: "5"
    command: ["python", "-m", "desk_day.launch", "trade-action-service"]

  blotter-service:
    <<: *service
    cpuset: "4"
    command: ["python", "-m", "desk_day.launch", "blotter-service"]

  books-service:
    <<: *service
    cpuset: "2,3"
    command: ["python", "-m", "desk_day.launch", "books-service"]

  monitoring-service:
    <<: *service
    cpuset: "2,3"
    command: ["python", "-m", "desk_day.launch", "monitoring-service"]

  client:
    <<: *desk
    cpuset: "0,1"
    environment:
      DATABASE_URL: postgresql+psycopg://desk:desk@postgres:5432/desk_seed
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: 1
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity

volumes:
  desk_pg:
