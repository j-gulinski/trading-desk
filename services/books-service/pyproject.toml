[project]
name = "books-service"
version = "0.1.0"
description = "Books service: book records and deactivation guards"
requires-python = ">=3.14"
dependencies = [
    "desk-domain",
    "desk-runtime",
    "bottle",
    "SQLAlchemy",
]

[project.scripts]
books-service = "books_service.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
