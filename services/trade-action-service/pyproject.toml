[project]
name = "trade-action-service"
version = "0.1.0"
description = "Trade-action service: order intake, validation and processing"
requires-python = ">=3.14"
dependencies = [
    "bottle",
    "SQLAlchemy",
    "structlog",
]

[project.scripts]
trade-action-service = "trade_action_service.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
