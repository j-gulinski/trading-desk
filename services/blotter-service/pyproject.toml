[project]
name = "blotter-service"
version = "0.1.0"
description = "Blotter service: trade store and valuation-enriched trade feed"
requires-python = ">=3.14"
dependencies = [
    "bottle",
    "SQLAlchemy",
]

[project.scripts]
blotter-service = "blotter_service.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
