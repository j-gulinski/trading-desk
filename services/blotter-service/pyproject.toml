[project]
name = "blotter-service"
version = "0.1.0"
description = "Blotter service: trade, valuation and portfolio reads"
requires-python = ">=3.14"
dependencies = [
    "desk-domain",
    "desk-runtime",
    "bottle",
    "SQLAlchemy",
]

[project.scripts]
blotter-service = "blotter_service.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
