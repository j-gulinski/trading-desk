services:
  market-data-service:
    build: ./market-data-service
    container_name: market-data-service
    ports:
      - "8001:8001"
    restart: unless-stopped
  pricing-service:
    build: ./pricing-service
    container_name: pricing-service
    ports:
      - "8002:8002"
    restart: unless-stopped
  monitoring-service:
    build: ./monitoring-service
    container_name: monitoring-service
    ports:
      - "8003:8003"
    restart: unless-stopped