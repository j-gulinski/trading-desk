x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  db-migrations:
    build:
      context: .
      dockerfile: docker/migrations.Dockerfile
    container_name: db-migrations
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MIGRATION_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  market-data-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: market-data-service
    container_name: market-data-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    logging: *default-logging

  pricing-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: pricing-service
    container_name: pricing-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8002:8002"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      market-data-service:
        condition: service_started
    logging: *default-logging

  monitoring-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: monitoring-service
    container_name: monitoring-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8003:8003"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    logging: *default-logging

  books-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: books-service
    container_name: books-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8004:8004"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    logging: *default-logging

  trade-action-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: trade-action-service
    container_name: trade-action-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8008:8008"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    logging: *default-logging

  blotter-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: blotter-service
    container_name: blotter-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8006:8006"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pricing-service:
        condition: service_started
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      - market-data-service
      - pricing-service
      - books-service
      - blotter-service
    logging: *default-logging

volumes:
  postgres_data:
  frontend_node_modules:
