x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service: &service
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  volumes:
    - ./logs:/var/log/trading
  restart: unless-stopped
  logging: *default-logging

services:
  postgres:
    image: postgres:18.6
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  db-migrations:
    build:
      context: .
      dockerfile: docker/migrations.Dockerfile
    container_name: db-migrations
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  market-data-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: market-data-service
    container_name: market-data-service
    ports:
      - "8001:8001"
    depends_on:
      db-migrations:
        condition: service_completed_successfully

  pricing-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: pricing-service
    container_name: pricing-service
    ports:
      - "8002:8002"
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      market-data-service:
        condition: service_healthy

  monitoring-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: monitoring-service
    container_name: monitoring-service
    ports:
      - "8003:8003"
    depends_on:
      db-migrations:
        condition: service_completed_successfully

  books-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: books-service
    container_name: books-service
    ports:
      - "8004:8004"
    depends_on:
      db-migrations:
        condition: service_completed_successfully

  trade-action-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: trade-action-service
    container_name: trade-action-service
    ports:
      - "8008:8008"
    depends_on:
      db-migrations:
        condition: service_completed_successfully

  blotter-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: blotter-service
    container_name: blotter-service
    ports:
      - "8006:8006"
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pricing-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      - market-data-service
      - pricing-service
      - monitoring-service
      - books-service
      - blotter-service
      - trade-action-service
    logging: *default-logging

volumes:
  postgres_data:
  frontend_node_modules:
