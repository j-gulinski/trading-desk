services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: db-migrations
    environment:
      - DATABASE_MIGRATION_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  market-data-service:
    build:
      context: .
      dockerfile: services/market-data-service/Dockerfile
    container_name: market-data-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile
    container_name: pricing-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8002:8002"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      market-data-service:
        condition: service_started

  monitoring-service:
    build:
      context: .
      dockerfile: services/monitoring-service/Dockerfile
    container_name: monitoring-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8003:8003"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully

  books-service:
    build:
      context: .
      dockerfile: services/books-service/Dockerfile
    container_name: books-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8004:8004"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully

  trade-action-service:
    build:
      context: .
      dockerfile: services/trade-action-service/Dockerfile
    container_name: trade-action-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8008:8008"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully

  trade-generation-service:
    build:
      context: .
      dockerfile: services/trade-generation-service/Dockerfile
    container_name: trade-generation-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8007:8007"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      books-service:
        condition: service_started
      trade-action-service:
        condition: service_started
      market-data-service:
        condition: service_started

  blotter-service:
    build:
      context: .
      dockerfile: services/blotter-service/Dockerfile
    container_name: blotter-service
    env_file: .env
    volumes:
      - ./logs:/var/log/trading
    ports:
      - "8006:8006"
    restart: unless-stopped
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      pricing-service:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - market-data-service
      - pricing-service
      - books-service
      - blotter-service

volumes:
  postgres_data: